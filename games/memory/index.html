<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Memory Match</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../shared/icon-192.png">
  <link rel="apple-touch-icon" href="../../shared/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hero Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1746c7">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="memory.css">
</head>
<body>
  <section id="play" class="screen">
    <header class="bar">
      <a id="home" class="btn plain" href="../../index.html" aria-label="Back to the arcade"><span data-icon="arrow_back"></span></a>
      <span class="spacer"></span>
      <div id="player-1" class="player one"><span data-icon="person"></span><b id="score-1">0</b></div>
      <div id="player-2" class="player two"><span data-icon="person"></span><b id="score-2">0</b></div>
      <span class="spacer"></span>
      <button id="sound" class="btn plain" aria-label="Sound on or off"></button>
    </header>
    <div id="table" class="table"><div id="cards" class="cards"></div></div>
  </section>

  <div id="setup" class="overlay" hidden>
    <div class="panel">
      <div class="players">
        <button id="solo" class="btn" aria-label="One player"><span data-icon="person"></span></button>
        <button id="duo" class="btn" aria-label="Two players"><span data-icon="group"></span></button>
      </div>
      <div id="sizes" class="choices"></div>
    </div>
  </div>

  <div id="need-pictures" class="overlay" hidden>
    <div class="panel">
      <a class="btn add-link" href="../puzzle/index.html" aria-label="Add pictures"><span data-icon="add_photo_alternate"></span></a>
    </div>
  </div>

  <div id="done" class="overlay won" hidden>
    <div class="panel">
      <div class="party"><span data-icon="celebration"></span></div>
      <div id="result" class="result"></div>
      <div class="actions">
        <button id="again" class="btn" aria-label="Play again"><span data-icon="replay"></span></button>
        <button id="change" class="btn sky" aria-label="Choose a new game"><span data-icon="grid_view"></span></button>
      </div>
    </div>
  </div>

  <img id="spotlight" class="spotlight" alt="" hidden>

  <script src="../../shared/icons.js"></script>
  <script src="../../shared/sfx.js"></script>
  <script src="../puzzle/own-pictures.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="memory.js"></script>
</body>
</html>
