<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Picture Puzzle</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../shared/icon-192.png">
  <link rel="apple-touch-icon" href="../../shared/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hero Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1746c7">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="puzzle.css">
</head>
<body>
  <section id="gallery" class="screen">
    <header class="bar">
      <a class="btn plain" href="../../index.html" aria-label="Back to the arcade"><span data-icon="arrow_back"></span></a>
      <span class="spacer"></span>
      <div class="rank">
        <b id="rank-icon"></b>
        <span class="rank-meter"><i id="rank-fill"></i></span>
        <small id="rank-stars"></small>
      </div>
    </header>
    <div id="tiles" class="tiles"></div>
  </section>

  <section id="play" class="screen" hidden>
    <header class="bar hud">
      <button id="quit" class="btn plain" aria-label="Back to the pictures"><span data-icon="arrow_back"></span></button>
      <span class="spacer"></span>
      <button id="hint" class="btn" aria-label="Show a hint"><span data-icon="lightbulb"></span></button>
      <button id="peek" class="btn sky" aria-label="Peek at the picture"><span data-icon="visibility"></span></button>
      <button id="sound" class="btn plain" aria-label="Sound on or off"></button>
    </header>
    <div class="status">
      <span id="count">0 / 0</span>
      <div class="progress"><i id="progress-fill"></i></div>
      <span id="score" class="score">0</span>
    </div>
    <div class="stage"><canvas id="board"></canvas></div>
  </section>

  <div id="levels" class="overlay" hidden>
    <div class="panel">
      <div id="levels-preview" class="preview"></div>
      <div id="level-buttons" class="level-buttons"></div>
      <button id="levels-close" class="btn plain" aria-label="Back"><span data-icon="arrow_back"></span></button>
    </div>
  </div>

  <div id="won" class="overlay won" hidden>
    <div class="panel">
      <div class="party"><span data-icon="celebration"></span></div>
      <div id="won-stars" class="win-stars"></div>
      <div class="tally">
        <div><span data-icon="workspace_premium"></span><b id="won-score">0</b></div>
        <div><span data-icon="local_fire_department"></span><b id="won-combo">0</b></div>
      </div>
      <div class="badges">
        <div id="won-record" class="badge" hidden><span data-icon="trophy"></span></div>
        <div id="won-rank" class="badge rank-up" hidden></div>
      </div>
      <div class="actions">
        <button id="next" class="btn" aria-label="Next picture"><span data-icon="arrow_forward"></span></button>
        <button id="harder" class="btn sky" aria-label="More pieces"><span data-icon="extension"></span></button>
        <button id="again" class="btn plain" aria-label="All pictures"><span data-icon="grid_view"></span></button>
      </div>
    </div>
  </div>

  <div id="confirm-remove" class="overlay" hidden>
    <div class="panel">
      <div id="remove-preview" class="preview"></div>
      <div class="actions">
        <button id="remove-yes" class="btn coral" aria-label="Remove"><span data-icon="delete"></span></button>
        <button id="remove-no" class="btn plain" aria-label="Keep it"><span data-icon="arrow_back"></span></button>
      </div>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="folder" type="file" webkitdirectory hidden>
  <div id="toast" class="toast" hidden></div>
  <div id="wipe" class="wipe"></div>

  <script src="../../shared/icons.js"></script>
  <script src="../../shared/sfx.js"></script>
  <script src="art.js"></script>
  <script src="own-pictures.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="jigsaw.js"></script>
  <script src="app.js"></script>
</body>
</html>
